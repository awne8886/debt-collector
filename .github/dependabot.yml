version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # davey 0.2 changed the DAVE voice API that discord.py 2.7 uses: the bot goes
      # silent in voice. Keep it below 0.2 until discord.py supports it.
      - dependency-name: davey
        versions: [">=0.2"]
      - dependency-name: discord.py
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
