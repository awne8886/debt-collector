name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt pytest ruff

      - name: Lint (ruff)
        run: ruff check --select F,E9,B,S102,S307,ASYNC .

      - name: Test
        env:
          # MongoClient connects lazily; nothing in the suite reaches a database.
          MONGO_URI: mongodb://127.0.0.1:1/?serverSelectionTimeoutMS=200
        run: python -m pytest -q
